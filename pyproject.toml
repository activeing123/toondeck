[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toondeck"
version = "0.2.0"
description = "One deck for every agent — MCP tools, skills, models and API keys, configured once, running everywhere. Powered by mcptoon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "activeing123" }]
keywords = ["mcp", "agent", "mcptoon", "skills", "gui", "dashboard"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "keyring>=25.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
toondeck = "toondeck.cli:main"

[project.urls]
Homepage = "https://github.com/activeing123/toondeck"
Repository = "https://github.com/activeing123/toondeck"
Issues = "https://github.com/activeing123/toondeck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
