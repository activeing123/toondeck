name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # manual re-publish without touching the release

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || 'manual' }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install build tools
      run: pip install build twine

    - name: Build package
      run: python -m build

    - name: Validate metadata before touching PyPI
      run: twine check dist/*

    - name: Check if version already exists on PyPI
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "Checking if toondeck==${VERSION} already exists on PyPI..."
        if pip index versions toondeck 2>/dev/null | grep -q "${VERSION}"; then
          echo "Version ${VERSION} already exists on PyPI. Skipping upload."
          echo "SKIP_UPLOAD=1" >> $GITHUB_ENV
        else
          echo "Version ${VERSION} not found on PyPI. Proceeding with upload."
        fi

    - name: Publish to PyPI
      if: env.SKIP_UPLOAD != '1'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        TWINE_NON_INTERACTIVE: "1"
      run: twine upload dist/*

    - name: Verify the JSON API serves the new version
      if: env.SKIP_UPLOAD != '1'
      run: |
        python - <<'EOF'
        import json, time, urllib.request
        for attempt in range(10):
            try:
                with urllib.request.urlopen("https://pypi.org/pypi/toondeck/json", timeout=10) as r:
                    data = json.load(r)
                print("PyPI JSON API now serves", data["info"]["version"])
                break
            except Exception as exc:
                print(f"attempt {attempt + 1}: {exc}")
                time.sleep(6)
        else:
            raise SystemExit("version not visible on the JSON API after 60s")
        EOF
